name: Release merged pull request

on:
  pull_request:
    branches:
      - live
    types:
      - closed

concurrency:
  group: release-live
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Package allowlisted module files
        id: package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          module_version="$(sed -n 's/.*<Version value="\(v[^"]*\)".*/\1/p' ImprovedGarrisons/SubModule.xml | head -n 1)"
          release_tag="$(printf '%s' "$PR_TITLE" | xargs)"

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'PR title "%s" is not a version tag (expected vX.Y.Z, e.g. v1.1.0) - rename the PR and re-merge.\n' "$PR_TITLE" >&2
            exit 1
          fi
          if [[ "$release_tag" != "$module_version" ]]; then
            printf 'PR title "%s" does not match ImprovedGarrisons/SubModule.xml (%s) - bump SubModule.xml to match before merging.\n' "$release_tag" "$module_version" >&2
            exit 1
          fi

          release_archive="$(bash scripts/package-release.sh dist "$release_tag")"

          {
            echo "module_version=$module_version"
            echo "release_tag=$release_tag"
            echo "release_archive=$release_archive"
          } >> "$GITHUB_OUTPUT"

      # Uploaded so stage-module ships the exact bytes that became the GitHub
      # release asset - not a second, separately-built copy that could drift
      # from the allowlist/DLL-parity checks package-release.sh just ran.
      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: improved-garrisons-release-archive
          path: ${{ steps.package.outputs.release_archive }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.release_archive }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          release_title="$RELEASE_TAG"

          # Use the merged PR's own description as the release notes when it has one.
          # `gh release create` can fall back to auto-generated notes for an
          # empty/title-only PR, but `gh release edit` has no --generate-notes flag,
          # so an empty body there just leaves the existing notes untouched.
          notes_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$notes_file"
          if [[ -s "$notes_file" ]]; then
            create_notes_args=(--notes-file "$notes_file")
            edit_notes_args=(--notes-file "$notes_file")
          else
            create_notes_args=(--generate-notes)
            edit_notes_args=()
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${RELEASE_ARCHIVE}#Client and dedicated-server module" --clobber
            gh release edit "$RELEASE_TAG" --title "$release_title" --latest "${edit_notes_args[@]}"
          else
            gh release create "$RELEASE_TAG" \
              "${RELEASE_ARCHIVE}#Client and dedicated-server module" \
              --target "$MERGE_SHA" \
              --title "$release_title" \
              --latest \
              "${create_notes_args[@]}"
          fi

  stage-module:
    name: Stage module for Steam Workshop
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release archive artifact
        uses: actions/download-artifact@v4
        with:
          name: improved-garrisons-release-archive
          path: archive

      # publish-on-steam's contentfolder expects Modules/ImprovedGarrisons/..., matching
      # Bannerlord's own module folder convention. Unzips the same archive that was
      # uploaded as the GitHub release asset, so Steam and GitHub always ship identical
      # contents - never a separately-assembled copy that could drift from the allowlist.
      - name: Stage into Modules/ImprovedGarrisons
        env:
          RELEASE_ARCHIVE_NAME: ImprovedGarrisons-${{ needs.release.outputs.release_tag }}.zip
        run: |
          set -euo pipefail
          mkdir -p staging/Modules
          unzip -q "archive/${RELEASE_ARCHIVE_NAME}" -d staging/Modules

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: improved-garrisons-module
          path: staging/

  # Updates the existing Steam Workshop item (3793463493) directly via steamcmd's
  # `workshop_build_item` - the same underlying call BUTR/Bannerlord.SteamWorkshop wraps
  # (confirmed by reading its source: github.com/BUTR/Bannerlord.SteamWorkshop) - but
  # authenticated with a persisted steamcmd login session instead of a Steam Guard Mobile
  # Authenticator shared_secret, so the publishing account's mobile Steam Guard is never
  # touched or extracted from.
  #
  # Requires two repo secrets set up once by hand (Settings > Secrets and variables >
  # Actions):
  #   STEAM_WORKSHOP_LOGIN      - the Steam account that owns the Workshop item
  #   STEAM_WORKSHOP_CONFIG_VDF - a base64-encoded steamcmd config.vdf. Generate it with a
  #     ONE-TIME normal login on your own machine (nothing to extract, no 2FA change):
  #       1. Install steamcmd: https://developer.valvesoftware.com/wiki/SteamCMD
  #       2. Run: steamcmd +login <that account's username> +quit
  #          Enter the password, then the 5-character code from the Steam mobile app when
  #          prompted - exactly like any other login.
  #       3. Run the exact same command again. It should NOT ask for the code a second
  #          time - that confirms the session is now persisted (this is what proves it
  #          worked, so don't skip this check).
  #       4. Base64-encode the resulting file and paste the output into the secret:
  #          Linux/macOS: cat ~/Steam/config/config.vdf | base64 -w0
  #          Windows:     certutil -encode config\config.vdf tmp.b64 && findstr /v /c:- tmp.b64
  #   If a run ever starts asking for the code again, redo steps 2-4 and replace the
  #   secret. Until both secrets exist, this job fails without affecting the GitHub
  #   release above, which already completed in the `release` job.
  #
  # NOTE: steamcmd always stores config/config.vdf under $HOME/Steam, regardless of where
  # the steamcmd binary itself is installed - confirmed from a live run's own log: even
  # when CyberAndrii/setup-steamcmd invokes steamcmd.sh by full absolute path from
  # /opt/hostedtoolcache/steamcmd/..., steamcmd still logs "Redirecting stderr to
  # '/home/runner/Steam/logs/stderr.txt'". A prior version of this step wrote config.vdf
  # to steps.steamcmd.outputs.directory instead, which steamcmd never looked at, so
  # login always fell through to "Cached credentials not found" + an empty interactive
  # password prompt. The restore step below must target $HOME/Steam.
  publish-on-steam:
    name: Publish on Steam Workshop
    needs: [release, stage-module]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup steamcmd
        uses: CyberAndrii/setup-steamcmd@v1

      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: improved-garrisons-module
          path: artifact

      - name: Restore persisted Steam login session
        env:
          CONFIG_VDF_B64: ${{ secrets.STEAM_WORKSHOP_CONFIG_VDF }}
        run: |
          set -euo pipefail
          STEAMCMD_DIR="$HOME/Steam"
          mkdir -p "$STEAMCMD_DIR/config"
          printf '%s' "$CONFIG_VDF_B64" | base64 -d > "$STEAMCMD_DIR/config/config.vdf"

      - name: Build and upload Workshop item
        env:
          STEAM_WORKSHOP_LOGIN: ${{ secrets.STEAM_WORKSHOP_LOGIN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.release_tag }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CONTENT_FOLDER: ${{ github.workspace }}/artifact/Modules/ImprovedGarrisons
          PREVIEW_FILE: ${{ github.workspace }}/ImprovedGarrisonsThumbnail.png
        run: |
          set -euo pipefail
          # Lead with the merged PR's own description, same text as the GitHub release
          # notes, then a link back to the full release page.
          #
          # steamcmd's workshop_build_item reads this VDF through Source's KeyValues text
          # parser, which pools each quoted value and aborts the whole build once one
          # crosses ~1024 chars (run 33646723566 failed at 1113 chars: "key name too
          # long", then the parser desynced entirely on "got } in key"). Cap the PR body
          # so the assembled changenote stays safely under that limit; the full text is
          # still on the GitHub release itself.
          max_body_len=800
          pr_body_trimmed="$PR_BODY"
          if [[ ${#pr_body_trimmed} -gt $max_body_len ]]; then
            pr_body_trimmed="${pr_body_trimmed:0:$max_body_len}"$'\n\n'"... (see full release notes at the link below)"
          fi

          changenote="Improved Garrisons ${RELEASE_TAG}"
          if [[ -n "$PR_BODY" ]]; then
            changenote="${changenote}"$'\n\n'"${pr_body_trimmed}"
          fi
          changenote="${changenote}"$'\n\n'"Full changelog: ${RELEASE_URL}"

          # steamcmd's workshop_build_item KeyValues parser has no working escape for an
          # embedded double quote here: a literal `"` inside the value closes the quoted
          # string early, and everything after it gets consumed as bogus tokens until the
          # file's own closing brace trips "got } in key" at EOF (confirmed by run
          # 33648462512 - the reported failure offset was exactly the file's byte length,
          # and the PR body contained a literal "key name too long" quote pair; backslash-
          # escaping the quote, tried previously, did not prevent this). Swap quotes for
          # single quotes instead of trying to escape them.
          changenote="${changenote//\"/\'}"

          vdf="$(mktemp --suffix=.vdf)"
          {
            printf '"workshopitem"\n'
            printf '{\n'
            printf '\t"appid"\t\t\t"261550"\n'
            printf '\t"publishedfileid"\t"3793463493"\n'
            printf '\t"contentfolder"\t\t"%s"\n' "$CONTENT_FOLDER"
            printf '\t"previewfile"\t\t"%s"\n' "$PREVIEW_FILE"
            printf '\t"changenote"\t\t"%s"\n' "$changenote"
            printf '}\n'
          } > "$vdf"
          steamcmd +login "$STEAM_WORKSHOP_LOGIN" +workshop_build_item "$vdf" +quit
